name: CodeQL (Scheduled)
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: 'never'
          output: 'codeql-results'

      - name: Save SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results/*.sarif

      - name: Fail if findings exist
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found $count issue(s). See the job summary or the codeql-results artifact."
            exit 1
          fi
